<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Morning Brief — Wahba Markets</title>
<link rel="stylesheet" href="style.css" />
<link rel="alternate" type="application/rss+xml" title="Wahba Markets Morning Brief" href="feed.xml" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📰</text></svg>" />
<style>
  .pub-wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; width: 100%; }
  .pub-nav { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .pub-nav a { color: var(--dim); text-decoration: none; font-size: 12px; letter-spacing: 1px; }
  .pub-nav a:hover, .pub-nav a.active { color: var(--green); }
  .pub-nav .spacer { flex: 1; }
  .brief-date-row { display: flex; align-items: baseline; gap: 14px; margin: 26px 0 6px; flex-wrap: wrap; }
  .brief-title { font-size: 26px; font-weight: 800; letter-spacing: 2px; color: var(--text); }
  .brief-date-row select { font-family: var(--mono); background: #060a07; color: var(--green); border: 1px solid var(--border-hi); border-radius: 4px; padding: 5px 8px; font-size: 12px; }
  .headline { color: var(--green); font-size: 14px; margin: 4px 0 18px; }
  .pulse { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .pulse .chip { border: 1px solid var(--border-hi); border-radius: 6px; padding: 8px 14px; background: var(--panel); font-size: 12px; }
  .pulse .chip b { color: var(--text); margin-right: 8px; }
  .vcard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; }
  .vcard-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .vcard-head .tkr { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: 1px; }
  .vcard-head .px { color: var(--dim); font-size: 12px; }
  .sig { font-weight: 800; letter-spacing: 2px; padding: 3px 12px; border-radius: 5px; border: 1.5px solid; font-size: 14px; }
  .sig.BUY { color: var(--green); border-color: var(--green-dim); background: #0c2214; }
  .sig.SELL { color: var(--red); border-color: #b91c1c; background: #220c0c; }
  .sig.HOLD, .sig.AVOID { color: var(--amber); border-color: #a16207; background: #221c0a; }
  .conv { color: var(--dim); font-size: 12px; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 18px; margin: 10px 0; font-size: 12px; }
  .vgrid .k { color: var(--faint); }
  .vgrid .v { color: var(--text); }
  .vsummary { color: #c2d4c6; font-size: 13px; line-height: 1.6; margin: 10px 0; }
  .vlists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .vlists h4 { color: var(--green); font-size: 10px; letter-spacing: 2px; margin-bottom: 5px; }
  .vlists .risks h4 { color: var(--red); }
  .vlists ul { margin-left: 16px; font-size: 11.5px; line-height: 1.55; color: #b7c9bb; }
  .empty-state { text-align: center; color: var(--dim); padding: 80px 20px; font-size: 13px; line-height: 2; }
  .empty-state .big { font-size: 20px; color: var(--text); }
  @media (max-width: 640px) { .vlists { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▲</span>
    <span class="brand-name">WAHBA&nbsp;MARKETS</span>
    <span class="brand-sub">MORNING BRIEF</span>
  </div>
</header>
<nav class="pub-nav">
  <a href="index.html">← THE DESK</a>
  <a href="brief.html" class="active">📰 MORNING BRIEF</a>
  <a href="scoreboard.html">🏆 ACCURACY SCOREBOARD</a>
  <span class="spacer"></span>
  <a href="feed.xml" title="Subscribe in any RSS reader">RSS ⚡</a>
</nav>

<div class="pub-wrap" id="wrap">
  <div class="empty-state" id="loading">loading…</div>
</div>

<footer class="footer">
  Every brief is generated by a 5-agent AI desk on real market data, published unedited, and scored publicly on the <a href="scoreboard.html" style="color:var(--green)">accuracy scoreboard</a>. Educational research — not financial advice.
</footer>

<script>
const $=id=>document.getElementById(id);
const fmt=(v,d=2)=>v==null||isNaN(v)?"—":Number(v).toFixed(d);
const pct=v=>v==null?"—":(v>=0?"+":"")+Number(v).toFixed(2)+"%";
const cls=v=>v==null?"":v>=0?"up":"down";
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function jget(u){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}

function emptyState(){
  $("wrap").innerHTML=`<div class="empty-state">
    <div class="big">No briefs published yet.</div>
    The desk publishes its Morning Brief on weekday mornings —<br/>
    every call is recorded at its live price and tracked forever on the <a href="scoreboard.html" style="color:var(--green)">scoreboard</a>.
  </div>`;
}

function render(brief, dates){
  const opts=dates.map(d=>`<option value="${d}" ${d===brief.date?"selected":""}>${d}</option>`).join("");
  const pulse=["spy","qqq","vix"].map(k=>{
    const p=brief.market&&brief.market[k];
    if(!p||p.price==null)return"";
    return `<span class="chip"><b>${esc(p.symbol)}</b>${fmt(p.price)} <span class="${cls(p.changePct)}">${pct(p.changePct)}</span></span>`;
  }).join("");
  const cards=(brief.entries||[]).map(e=>{
    const v=e.verdict;
    return `<div class="vcard">
      <div class="vcard-head">
        <span class="sig ${esc(v.signal)}">${esc(v.signal)}</span>
        <span class="tkr">${esc(e.ticker)}</span>
        <span class="px">@ ${fmt(e.price)} ${esc(e.currency||"USD")} at publication</span>
        <span class="conv">conviction <b>${esc(v.conviction)}/10</b></span>
      </div>
      <div class="vgrid">
        <span><span class="k">Target: </span><span class="v">${esc(v.target_price)}</span></span>
        <span><span class="k">Invalidation: </span><span class="v">${esc(v.invalidation)}</span></span>
        <span><span class="k">Horizon: </span><span class="v">${esc(v.time_horizon)}</span></span>
      </div>
      <div class="vsummary">${esc(v.summary)}</div>
      <div class="vlists">
        <div><h4>KEY EVIDENCE</h4><ul>${(v.key_evidence||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="risks"><h4>KEY RISKS</h4><ul>${(v.key_risks||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>
    </div>`;
  }).join("");
  const errs=(brief.errors||[]).length?`<div class="vcard" style="border-color:#7f1d1d"><span style="color:var(--red);font-size:12px">Skipped: ${brief.errors.map(e=>esc(e.ticker)+" ("+esc(e.error)+")").join(", ")}</span></div>`:"";
  $("wrap").innerHTML=`
    <div class="brief-date-row">
      <span class="brief-title">MORNING BRIEF</span>
      <select id="dateSel">${opts}</select>
      <span class="conv">published ${new Date(brief.generatedAt).toLocaleString()}</span>
    </div>
    <div class="headline">${esc(brief.headline)}</div>
    <div class="pulse">${pulse}</div>
    ${cards}${errs}`;
  $("dateSel").addEventListener("change",e=>load(e.target.value,dates));
}

async function load(date,dates){
  try{
    const brief=await jget(date?`data/brief-${date}.json`:"data/latest.json");
    render(brief,dates);
  }catch{ emptyState(); }
}

(async()=>{
  let dates=[];
  try{ dates=await jget("data/briefs-index.json"); }catch{}
  if(!dates.length)return emptyState();
  const q=new URLSearchParams(location.search).get("date");
  load(q&&dates.includes(q)?q:dates[0],dates);
})();
</script>
</body>
</html>
