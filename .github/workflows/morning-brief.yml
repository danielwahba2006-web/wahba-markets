name: Morning Brief

# MANUAL ONLY — no schedule, so this can never spend API credits on its own.
# Run it yourself from the Actions tab when (and only when) you want a brief.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 0eff93b3-13d9-497b-a7cb-c94977b7f64c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Require API key secret
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in Settings → Secrets and variables → Actions."
          exit 1

      - name: Generate today's Morning Brief (full agent cycles)
        run: node scripts/run-brief.js

      - name: Commit updated ledger + public data
        run: |
          git config user.name "wahba-markets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data public/data public/feed.xml
          git diff --cached --quiet || git commit -m "Morning brief $(date -u +%F)"
          git pull --rebase origin main || true
          git push

      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: npx --yes netlify-cli deploy --prod --site "$NETLIFY_SITE_ID"
